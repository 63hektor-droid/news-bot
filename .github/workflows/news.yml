name: news-bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # No `cache: pip` here: restoring the ~3 GB pip cache (~40 s) was slower
      # than downloading the wheels directly from PyPI.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-v1

      - name: Cache Argos Translate model
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-en-fa-v1

      # ffmpeg + Persian fonts are installed in the background while pip runs,
      # so they no longer cost extra time inside the bot.
      - name: Install requirements (+ ffmpeg and fonts in parallel)
        run: |
          if [ "${ENABLE_VIDEO}" = "1" ]; then
            (
              sudo apt-get update -qq &&
              sudo apt-get install -y -qq ffmpeg fonts-vazirmatn fonts-noto-core
            ) > /tmp/apt.log 2>&1 &
            APT_PID=$!
          fi
          pip install -r requirements.txt
          if [ -n "${APT_PID:-}" ]; then
            wait "$APT_PID" || { echo "::warning::apt install failed, bot will retry on its own"; tail -n 20 /tmp/apt.log; }
          fi
        env:
          ENABLE_VIDEO: "1"

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          MAX_POSTS_PER_RUN: "3"
          POST_GAP_SEC: "90"
          MIN_SCORE: "4"
          MAX_AGE_HOURS: "8"
          ENABLE_VIDEO: "1"
          WHISPER_MODEL: "base"
        run: python -u bot.py

      - name: Save state
        if: always()
        run: |
          mkdir -p state
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "state [skip ci]"
            ok=0
            for i in 1 2 3 4 5; do
              if git pull --rebase -q && git push -q; then
                ok=1
                break
              fi
              echo "push attempt $i failed, retrying..."
              sleep $((i * 5))
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::failed to push state after retries"
              exit 1
            fi
          fi
